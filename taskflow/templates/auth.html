{% extends "base.html" %}{% block content %}<section class="auth panel"><p class="eyebrow">ACCOUNT</p><h1>{{ mode }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="10" autocomplete="current-password"></label><button class="button">{{ mode }}</button></form><p class="muted">{% if mode == "Sign in" %}New here? <a href="{{ url_for('register') }}">Create account</a>{% else %}Already registered? <a href="{{ url_for('login') }}">Sign in</a>{% endif %}</p></section>{% endblock %}
